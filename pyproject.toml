[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymigrate"
version = "0.1.0"
description = "Provider-agnostic autonomous cross-language migration platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jamal Balya" }]
keywords = ["code-migration", "refactoring", "llm", "graphify"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
parsers = ["tree-sitter-language-pack>=1.6.0,<2.0"]
security = ["bandit>=1.8.6,<2.0", "semgrep>=1.100.0,<2.0"]

[project.scripts]
polymigrate = "polymigrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
polymigrate = ["skills/builtin/*/skill.json", "skills/builtin/*/SKILL.md", "security/semgrep_rules.yml"]
