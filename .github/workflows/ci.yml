name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        if: matrix.python-version == '3.12'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install --editable ".[parsers]"
      - name: Build wheel and verify packaged skills
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("polymigrate-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              f"polymigrate/skills/builtin/{skill}/{file}"
              for skill in ("behavior-preservation", "graphify-analysis", "library-replacement")
              for file in ("skill.json", "SKILL.md")
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Built wheel is missing skill assets: {sorted(missing)}")
          print(f"Verified {len(required)} packaged skill assets in {wheel.name}")
          PY
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit, integration, and E2E tests
        run: python -m unittest discover -s tests -v

  docker-behavior-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      POLYMIGRATE_RUN_DOCKER_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --editable .
      - name: Pull preapproved behavior test images
        run: |
          docker pull python:3.12-slim
          docker pull node:22-alpine
          docker pull golang:1.23-alpine
      - name: Run real sandboxed behavior comparison
        run: python -m unittest discover -s tests -p "test_behavior_comparison_docker.py" -v

  php-deterministic-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli
      - name: Install package
        run: python -m pip install --editable .
      - name: Run PHP translator and CLI runtime tests
        run: python -m unittest tests.test_python_php_target tests.test_cli_deterministic_php -v

  ruby-deterministic-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruby CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ruby
      - name: Install package
        run: python -m pip install --editable .
      - name: Run Ruby translator and CLI runtime tests
        run: python -m unittest tests.test_python_ruby_target tests.test_cli_deterministic_ruby -v

  cpp-deterministic-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++
      - name: Install package
        run: python -m pip install --editable .
      - name: Run C++ translator and CLI runtime tests
        run: python -m unittest tests.test_python_cpp_target tests.test_cli_deterministic_cpp -v

  csharp-deterministic-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install package
        run: python -m pip install --editable .
      - name: Run C# translator and CLI build/runtime tests
        run: python -m unittest tests.test_python_csharp_target tests.test_cli_deterministic_csharp -v
