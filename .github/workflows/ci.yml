name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --editable .
      - name: Build wheel and verify packaged skills
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("polymigrate-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              f"polymigrate/skills/builtin/{skill}/{file}"
              for skill in ("behavior-preservation", "graphify-analysis", "library-replacement")
              for file in ("skill.json", "SKILL.md")
          }
          missing = required - names
          if missing:
              raise SystemExit(f"Built wheel is missing skill assets: {sorted(missing)}")
          print(f"Verified {len(required)} packaged skill assets in {wheel.name}")
          PY
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit, integration, and E2E tests
        run: python -m unittest discover -s tests -v
